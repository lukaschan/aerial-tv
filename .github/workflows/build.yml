name: Build APKs

# Fork addition: upstream ships releases by hand; this builds both flavors in CI so a
# change can be verified (and an APK produced) without a local Android SDK.
# Signing uses the fork's own stable key, restored from repo secrets into
# local/signing.properties (upstream's mechanism), so CI builds update in place and
# keep the app's settings. Without the secrets it falls back to the debug key.

on:
  workflow_dispatch:
  push:
    branches: [main, patch/wake-boot-source]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already carries an Android SDK; setup-android@v3 still asks
      # sdkmanager for the long-removed "tools" package and fails, so install directly.
      - name: Install SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore the fork's signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p local
          echo "$KEYSTORE_B64" | base64 -d > local/aerial.keystore
          printf 'storeFile=aerial.keystore\nstorePassword=%s\nkeyAlias=aerial\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" > local/signing.properties

      # No lint: upstream code carries a pre-existing RestrictedApi error
      # (MainActivity.dispatchKeyEvent) that lint aborts on; upstream releases assemble only.
      - name: Build both flavors
        run: ./gradlew assembleStandardRelease assembleGuardRelease --console=plain

      - name: Name the APKs like the release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/aerial-standard.apk
          cp app/build/outputs/apk/guard/release/app-guard-release.apk dist/aerial-guard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aerial-apks
          path: dist/
